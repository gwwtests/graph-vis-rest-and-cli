<!DOCTYPE html>
<html>
<head>
    <title>Graph Visualization</title>
    <script type="text/javascript"
        src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/10.0.2/standalone/umd/vis-network.min.js"
        onerror="loadLocalFallback()"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/10.0.2/styles/vis-network.min.css"
        rel="stylesheet" type="text/css"
        onerror="this.href='/static/deps/vis-network.min.css'" />
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        #mode-toggle {
            position: fixed;
            left: 20px;
            top: 20px;
            padding: 8px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            z-index: 100;
            font-size: 8px;
        }
        #mode-toggle:hover {
            background-color: #45a049;
        }
        #input-container {
            width: 80%;
            margin: 0 auto 20px auto;
            display: flex;
            gap: 10px;
        }
        #relationship-input, #bulk-input {
            flex-grow: 1;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 4px;
        }
        #bulk-input {
            display: none;
            min-height: 100px;
            font-family: monospace;
        }
        #add-button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #add-button:hover {
            background-color: #45a049;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        #graph {
            width: 100%;
            height: calc(100vh - 40px);
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        #ws-status {
            position: fixed;
            right: 20px;
            top: 20px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ccc;
            z-index: 100;
            title: "WebSocket status";
        }
        #highlight-controls {
            position: fixed;
            left: 20px;
            top: 50px;
            z-index: 100;
            font-size: 11px;
        }
        #highlight-mode-select {
            font-size: 11px;
            padding: 2px 4px;
            border-radius: 3px;
            border: 1px solid #999;
        }
    </style>
</head>
<body>
    <button id="mode-toggle">Multi</button>
    <div id="highlight-controls">
        <label>Highlight: <select id="highlight-mode-select">
            <option value="none">none</option>
            <option value="fade">fade</option>
            <option value="pulse">pulse</option>
            <option value="glow">glow</option>
        </select></label>
    </div>
    <div id="ws-status" title="WebSocket: disconnected"></div>
    <div id="input-container">
        <input type="text" id="relationship-input"
            placeholder="Enter relationship as: start edge end (e.g., 'John loves Mary')">
        <textarea id="bulk-input"
            placeholder="Enter multiple relationships (one per line or space-separated):&#10;Alice calls Bob&#10;Bob calls Charlie&#10;Charlie emails David"></textarea>
        <button id="add-button">Add</button>
    </div>
    <div id="graph"></div>

    <div id="overlay" class="overlay"></div>

    <script>
        // Local fallback loader for vis-network
        function loadLocalFallback() {
            const s = document.createElement('script');
            s.src = '/static/deps/vis-network.min.js';
            document.head.appendChild(s);
        }

        // ---------------------------------------------------------------
        // API integration
        // ---------------------------------------------------------------
        const api = {
            async getGraph() {
                const r = await fetch('/api/graph');
                return r.json();
            },
            async addNode(id, label) {
                return fetch('/api/add-node', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id, label}),
                });
            },
            async removeNode(id) {
                return fetch('/api/remove-node', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id}),
                });
            },
            async addEdge(from, to, label, id) {
                const body = {from, to, label};
                if (id) body.id = id;
                return fetch('/api/add-edge', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body),
                });
            },
            async removeEdge(id) {
                return fetch('/api/remove-edge', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id}),
                });
            },
            async addTriplet(subject, predicate, object) {
                return fetch('/api/add-triplet', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({subject, predicate, object}),
                });
            },
            async getHighlightMode() {
                const r = await fetch('/api/highlight-mode');
                return r.json();
            },
            async setHighlightMode(settings) {
                return fetch('/api/highlight-mode', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(settings),
                });
            },
            async getInputMode() {
                const r = await fetch('/api/input-mode');
                return r.json();
            },
            async setInputMode(mode) {
                return fetch('/api/input-mode', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({mode}),
                });
            },
        };

        // ---------------------------------------------------------------
        // Color utilities
        // ---------------------------------------------------------------
        function hexToRgb(hex) {
            const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
            return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [0, 0, 0];
        }

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(c => Math.round(c).toString(16).padStart(2, '0')).join('');
        }

        function lerpColor(hexA, hexB, t) {
            const a = hexToRgb(hexA), b = hexToRgb(hexB);
            return rgbToHex(
                a[0] + (b[0] - a[0]) * t,
                a[1] + (b[1] - a[1]) * t,
                a[2] + (b[2] - a[2]) * t,
            );
        }

        // ---------------------------------------------------------------
        // HighlightManager — animate new nodes/edges
        // ---------------------------------------------------------------
        class HighlightManager {
            constructor(nodesDS, edgesDS) {
                this.nodes = nodesDS;
                this.edges = edgesDS;
                this.activeNodes = new Map(); // id → {startTime}
                this.activeEdges = new Map();
                this.running = false;
                this.settings = {
                    mode: 'none',
                    fadeDuration: 3000,
                    highlightColor: '#FFD700',
                    highlightEdgeColor: '#FF6B35',
                };
                // Default vis-network colors
                this.defaultNodeColor = '#97C2FC';
                this.defaultNodeBorder = '#2B7CE9';
                this.defaultEdgeColor = '#848484';
            }

            registerNode(id) {
                if (this.settings.mode === 'none') return;
                this.activeNodes.set(id, {startTime: performance.now()});
                this._startLoop();
            }

            registerEdge(id) {
                if (this.settings.mode === 'none') return;
                this.activeEdges.set(id, {startTime: performance.now()});
                this._startLoop();
            }

            unregisterNode(id) {
                if (this.activeNodes.delete(id)) {
                    this._resetProps(id, 'node');
                }
            }

            unregisterEdge(id) {
                if (this.activeEdges.delete(id)) {
                    this._resetProps(id, 'edge');
                }
            }

            clearAll() {
                // Reset all active items before clearing
                for (const id of this.activeNodes.keys()) this._resetProps(id, 'node');
                for (const id of this.activeEdges.keys()) this._resetProps(id, 'edge');
                this.activeNodes.clear();
                this.activeEdges.clear();
            }

            updateSettings(s) {
                if (s.mode !== undefined) this.settings.mode = s.mode;
                if (s.fadeDuration !== undefined) this.settings.fadeDuration = s.fadeDuration;
                if (s.highlightColor !== undefined) this.settings.highlightColor = s.highlightColor;
                if (s.highlightEdgeColor !== undefined) this.settings.highlightEdgeColor = s.highlightEdgeColor;
            }

            _startLoop() {
                if (this.running) return;
                this.running = true;
                const loop = (now) => {
                    this._tick(now);
                    if (this.activeNodes.size > 0 || this.activeEdges.size > 0) {
                        requestAnimationFrame(loop);
                    } else {
                        this.running = false;
                    }
                };
                requestAnimationFrame(loop);
            }

            _computeIntensity(elapsed) {
                const t = Math.min(elapsed / this.settings.fadeDuration, 1);
                return Math.max(0, 1 - Math.log(1 + t * (Math.E - 1)));
            }

            _tick(now) {
                const mode = this.settings.mode;
                if (mode === 'none') return;

                const nodeUpdates = [];
                const edgeUpdates = [];
                const expiredNodes = [];
                const expiredEdges = [];

                for (const [id, info] of this.activeNodes) {
                    const elapsed = now - info.startTime;
                    const intensity = this._computeIntensity(elapsed);
                    if (intensity <= 0) {
                        expiredNodes.push(id);
                    } else {
                        nodeUpdates.push({id, ...this._nodeProps(intensity, mode)});
                    }
                }

                for (const [id, info] of this.activeEdges) {
                    const elapsed = now - info.startTime;
                    const intensity = this._computeIntensity(elapsed);
                    if (intensity <= 0) {
                        expiredEdges.push(id);
                    } else {
                        edgeUpdates.push({id, ...this._edgeProps(intensity, mode)});
                    }
                }

                if (nodeUpdates.length) this.nodes.update(nodeUpdates);
                if (edgeUpdates.length) this.edges.update(edgeUpdates);

                for (const id of expiredNodes) {
                    this.activeNodes.delete(id);
                    this._resetProps(id, 'node');
                }
                for (const id of expiredEdges) {
                    this.activeEdges.delete(id);
                    this._resetProps(id, 'edge');
                }
            }

            _nodeProps(intensity, mode) {
                switch (mode) {
                    case 'fade':
                        return {
                            color: {
                                background: lerpColor(this.defaultNodeColor, this.settings.highlightColor, intensity),
                                border: lerpColor(this.defaultNodeBorder, this.settings.highlightColor, intensity),
                            },
                        };
                    case 'pulse': {
                        const osc = Math.sin(performance.now() / 100) * intensity;
                        const size = 30 + 15 * osc;
                        const borderWidth = 1 + 3 * intensity;
                        return {size, borderWidth};
                    }
                    case 'glow':
                        return {
                            shadow: {
                                enabled: true,
                                color: this.settings.highlightColor,
                                size: 20 * intensity,
                                x: 0, y: 0,
                            },
                        };
                    default:
                        return {};
                }
            }

            _edgeProps(intensity, mode) {
                switch (mode) {
                    case 'fade':
                        return {
                            color: {color: lerpColor(this.defaultEdgeColor, this.settings.highlightEdgeColor, intensity)},
                        };
                    case 'pulse': {
                        const osc = Math.sin(performance.now() / 100) * intensity;
                        return {width: 1 + 3 * Math.abs(osc)};
                    }
                    case 'glow':
                        return {
                            shadow: {
                                enabled: true,
                                color: this.settings.highlightEdgeColor,
                                size: 10 * intensity,
                                x: 0, y: 0,
                            },
                        };
                    default:
                        return {};
                }
            }

            _resetProps(id, type) {
                try {
                    if (type === 'node') {
                        this.nodes.update({id, color: null, size: null, borderWidth: null, shadow: false});
                    } else {
                        this.edges.update({id, color: null, width: null, shadow: false});
                    }
                } catch (e) {
                    // Item may have been removed already
                }
            }
        }

        // ---------------------------------------------------------------
        // WebSocket client with auto-reconnect
        // ---------------------------------------------------------------
        const wsStatus = document.getElementById('ws-status');
        let ws = null;
        let wsReconnectTimer = null;

        function setWsState(state) {
            const colors = {connected: '#4CAF50', connecting: '#FFC107', disconnected: '#F44336'};
            wsStatus.style.backgroundColor = colors[state] || '#ccc';
            wsStatus.title = 'WebSocket: ' + state;
        }

        function connectWebSocket() {
            if (ws && ws.readyState <= WebSocket.OPEN) return;
            setWsState('connecting');
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(proto + '//' + location.host + '/ws');

            ws.onopen = () => {
                setWsState('connected');
                if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
            };

            ws.onclose = () => {
                setWsState('disconnected');
                ws = null;
                wsReconnectTimer = setTimeout(connectWebSocket, 2000);
            };

            ws.onerror = () => {
                ws.close();
            };

            ws.onmessage = (evt) => {
                const msg = JSON.parse(evt.data);
                if (msg.command) {
                    handleWsCommand(msg);
                } else {
                    handleWsEvent(msg);
                }
            };
        }

        function handleWsEvent(msg) {
            const {event, data} = msg;
            switch (event) {
                case 'add-node':
                    if (!nodes.get(data.id)) nodes.add(data);
                    highlightMgr.registerNode(data.id);
                    break;
                case 'remove-node':
                    highlightMgr.unregisterNode(data.id);
                    if (data.connected_edges) {
                        data.connected_edges.forEach(eid => highlightMgr.unregisterEdge(eid));
                        edges.remove(data.connected_edges);
                    }
                    nodes.remove(data.id);
                    break;
                case 'add-edge': {
                    // Endpoint nodes auto-created server-side arrive as data.nodes
                    // (mirrors add-triplet), so add them before the edge.
                    const { nodes: newNodes, ...edgeData } = data;
                    if (newNodes) newNodes.forEach(n => {
                        if (!nodes.get(n.id)) {
                            nodes.add(n);
                            highlightMgr.registerNode(n.id);
                        }
                    });
                    if (!edges.get(edgeData.id)) edges.add(edgeData);
                    highlightMgr.registerEdge(edgeData.id);
                    break;
                }
                case 'remove-edge':
                    highlightMgr.unregisterEdge(data.id);
                    edges.remove(data.id);
                    break;
                case 'add-triplet':
                    if (data.nodes) data.nodes.forEach(n => {
                        if (!nodes.get(n.id)) nodes.add(n);
                        highlightMgr.registerNode(n.id);
                    });
                    if (data.edge && !edges.get(data.edge.id)) {
                        edges.add(data.edge);
                        highlightMgr.registerEdge(data.edge.id);
                    }
                    break;
                case 'clear':
                    highlightMgr.clearAll();
                    nodes.clear();
                    edges.clear();
                    break;
                case 'highlight-mode':
                    highlightMgr.updateSettings(data);
                    document.getElementById('highlight-mode-select').value = data.mode;
                    break;
                case 'input-mode':
                    setInputMode(data.mode);
                    break;
                case 'action':
                    executeAction(data, false);  // false = don't re-broadcast
                    break;
            }
        }

        // ---------------------------------------------------------------
        // Initialize vis-network
        // ---------------------------------------------------------------
        const nodes = new vis.DataSet();
        const edges = new vis.DataSet();

        const container = document.getElementById('graph');
        const data = { nodes: nodes, edges: edges };
        const options = {
            nodes: {
                shape: 'circle',
                size: 30,
                font: { size: 14 }
            },
            edges: {
                arrows: 'to',
                font: { size: 14, align: 'middle' }
            },
            physics: {
                enabled: true,
                stabilization: false,
                solver: 'forceAtlas2Based',
                forceAtlas2Based: {
                    gravitationalConstant: -50,
                    centralGravity: 0.01,
                    springLength: 200,
                    springConstant: 0.08
                }
            }
        };
        const network = new vis.Network(container, data, options);

        const highlightMgr = new HighlightManager(nodes, edges);

        // ---------------------------------------------------------------
        // Extension command handler registry
        // ---------------------------------------------------------------
        const extCommandHandlers = {};

        // ---------------------------------------------------------------
        // WS command handler (server → browser → server)
        // ---------------------------------------------------------------
        async function handleWsCommand(msg) {
            const {command, request_id, params} = msg;
            let result = {};
            try {
                // Check extension handlers first
                if (extCommandHandlers[command]) {
                    result = await extCommandHandlers[command](params || {});
                } else {
                    switch (command) {
                        case 'capture-screenshot':
                            result = await captureScreenshot(params || {});
                            break;
                        case 'get-dom':
                            result = getDomInfo();
                            break;
                        case 'set-ui':
                            result = setUiState(params || {});
                            break;
                        default:
                            result = {error: 'Unknown command: ' + command};
                    }
                }
            } catch (e) {
                result = {error: e.message};
            }
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({response_to: request_id, data: result}));
            }
        }

        async function captureScreenshot(params) {
            const {padding = 0.1, fit = true, format = 'png', quality = 0.92,
                   width, height, hide_ui = true, background = 'white'} = params;

            const inputContainer = document.getElementById('input-container');
            const modeToggle = document.getElementById('mode-toggle');
            const wsStatusEl = document.getElementById('ws-status');

            // Save and hide UI
            const savedDisplay = {};
            if (hide_ui) {
                for (const el of [inputContainer, modeToggle, wsStatusEl]) {
                    if (el) {
                        savedDisplay[el.id] = el.style.display;
                        el.style.display = 'none';
                    }
                }
            }

            // Save original canvas size
            const graphEl = document.getElementById('graph');
            const savedWidth = graphEl.style.width;
            const savedHeight = graphEl.style.height;

            // Resize if requested
            if (width) graphEl.style.width = width + 'px';
            if (height) graphEl.style.height = height + 'px';
            if (width || height) network.redraw();

            // Fit to content with padding
            if (fit) {
                const allNodeIds = nodes.getIds();
                if (allNodeIds.length > 0) {
                    network.fit({
                        nodes: allNodeIds,
                        animation: false,
                        minZoomLevel: 0.1,
                        maxZoomLevel: 5,
                    });
                    // Apply padding by zooming out slightly
                    if (padding > 0) {
                        const currentScale = network.getScale();
                        network.moveTo({scale: currentScale * (1 - padding), animation: false});
                    }
                }
            }

            // Wait for render to complete
            await new Promise(r => setTimeout(r, 150));

            // Capture canvas with background
            const canvas = document.querySelector('#graph canvas');
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.fillStyle = background;
            tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            tempCtx.drawImage(canvas, 0, 0);

            const mimeType = format === 'jpeg' ? 'image/jpeg' : 'image/png';
            const image = tempCanvas.toDataURL(mimeType, quality);

            // Restore canvas size
            if (width || height) {
                graphEl.style.width = savedWidth;
                graphEl.style.height = savedHeight;
                network.redraw();
            }

            // Restore UI
            if (hide_ui) {
                for (const el of [inputContainer, modeToggle, wsStatusEl]) {
                    if (el) {
                        el.style.display = savedDisplay[el.id] || '';
                    }
                }
            }

            return {image};
        }

        function getDomInfo() {
            const positions = network.getPositions();
            const scale = network.getScale();
            const viewPosition = network.getViewPosition();
            const canvasEl = document.querySelector('#graph canvas');

            const nodeList = nodes.get().map(n => ({
                ...n,
                x: positions[n.id] ? positions[n.id].x : null,
                y: positions[n.id] ? positions[n.id].y : null,
            }));

            return {
                viewport: {x: viewPosition.x, y: viewPosition.y},
                nodes: nodeList,
                edges: edges.get(),
                canvas: {width: canvasEl ? canvasEl.width : 0, height: canvasEl ? canvasEl.height : 0},
                scale: scale,
            };
        }

        function setUiState(params) {
            const inputContainer = document.getElementById('input-container');
            const modeToggle = document.getElementById('mode-toggle');

            if (params.input_visible !== undefined) {
                inputContainer.style.display = params.input_visible ? 'flex' : 'none';
                modeToggle.style.display = params.input_visible ? '' : 'none';
            }
            return {ok: true, input_visible: inputContainer.style.display !== 'none'};
        }

        // ---------------------------------------------------------------
        // Highlight mode dropdown
        // ---------------------------------------------------------------
        const highlightSelect = document.getElementById('highlight-mode-select');
        highlightSelect.addEventListener('change', () => {
            api.setHighlightMode({mode: highlightSelect.value});
        });

        // ---------------------------------------------------------------
        // Input mode handling (4 modes: multiline, single, minimal, none)
        // ---------------------------------------------------------------
        const modeToggle = document.getElementById('mode-toggle');
        const inputContainer = document.getElementById('input-container');
        const singleInput = document.getElementById('relationship-input');
        const bulkInput = document.getElementById('bulk-input');
        const addButton = document.getElementById('add-button');
        let currentInputMode = 'multiline';

        // Cycle order for user toggle (none is server-only)
        const CYCLE_MODES = ['multiline', 'single', 'minimal'];
        const CYCLE_LABELS = {multiline: '▤ Multi', single: '▬ Single', minimal: '◼ Min'};

        function resizeGraph() {
            const graphEl = document.getElementById('graph');
            const inputEl = document.getElementById('input-container');
            const inputVisible = inputEl && inputEl.style.display !== 'none';
            const inputHeight = inputVisible ? inputEl.offsetHeight + 20 : 0;
            graphEl.style.height = 'calc(100vh - ' + (40 + inputHeight) + 'px)';
            if (typeof network !== 'undefined') network.redraw();
        }

        function setInputMode(mode) {
            currentInputMode = mode;
            switch (mode) {
                case 'multiline':
                    modeToggle.style.display = '';
                    modeToggle.textContent = CYCLE_LABELS.multiline;
                    inputContainer.style.display = 'flex';
                    singleInput.style.display = 'none';
                    bulkInput.style.display = 'block';
                    addButton.style.display = '';
                    break;
                case 'single':
                    modeToggle.style.display = '';
                    modeToggle.textContent = CYCLE_LABELS.single;
                    inputContainer.style.display = 'flex';
                    singleInput.style.display = 'block';
                    bulkInput.style.display = 'none';
                    addButton.style.display = '';
                    break;
                case 'minimal':
                    modeToggle.style.display = '';
                    modeToggle.textContent = CYCLE_LABELS.minimal;
                    inputContainer.style.display = 'none';
                    break;
                case 'none':
                    modeToggle.style.display = 'none';
                    inputContainer.style.display = 'none';
                    break;
            }
            setTimeout(resizeGraph, 10);
        }

        modeToggle.addEventListener('click', () => {
            const idx = CYCLE_MODES.indexOf(currentInputMode);
            const next = CYCLE_MODES[(idx + 1) % CYCLE_MODES.length];
            setInputMode(next);
        });
        setInputMode('minimal');
        window.addEventListener('resize', resizeGraph);

        // ---------------------------------------------------------------
        // Hook action executor
        // ---------------------------------------------------------------
        /**
         * Execute a hook action locally, optionally broadcasting to other clients.
         * @param {object} action - The action to execute
         * @param {boolean} broadcast - If true, send to server for relay to other clients
         */
        function executeAction(action, broadcast) {
            if (broadcast === undefined) broadcast = true;
            switch (action.action) {
                case 'toggle_node': {
                    const node = nodes.get(action.id);
                    if (!node) return;
                    const isHidden = node.hidden === true;
                    const show = isHidden;
                    nodes.update({ id: action.id, hidden: !show, physics: show });
                    const connEdges = network.getConnectedEdges(action.id);
                    for (const eid of connEdges) {
                        const edge = edges.get(eid);
                        if (!edge) continue;
                        if (!show) {
                            edges.update({ id: eid, hidden: true, physics: false });
                        } else {
                            const otherId = edge.from === action.id ? edge.to : edge.from;
                            const other = nodes.get(otherId);
                            if (other && other.hidden !== true) {
                                edges.update({ id: eid, hidden: false, physics: true });
                            }
                        }
                    }
                    break;
                }
                case 'toggle_edge': {
                    const edge = edges.get(action.id);
                    if (!edge) return;
                    const isHidden = edge.hidden === true;
                    edges.update({ id: action.id, hidden: !isHidden, physics: isHidden });
                    break;
                }
                case 'restyle': {
                    const { action: _, ...props } = action;
                    const target = nodes.get(props.id) ? nodes : edges;
                    target.update(props);
                    break;
                }
                case 'toggle_style': {
                    const { action: _, id, style } = action;
                    const target = nodes.get(id) ? nodes : edges;
                    const item = target.get(id);
                    if (!item) return;
                    if (item._original_style) {
                        target.update({ id, ...item._original_style, _original_style: null });
                    } else {
                        const original = {};
                        for (const key of Object.keys(style)) {
                            original[key] = item[key];
                        }
                        target.update({ id, ...style, _original_style: original });
                    }
                    break;
                }
                case 'add_node': {
                    const { action: _, ...nodeData } = action;
                    if (!nodes.get(nodeData.id)) {
                        if (!nodeData.label) nodeData.label = nodeData.id;
                        nodes.add(nodeData);
                    }
                    break;
                }
                case 'remove_node': {
                    // Cascade-remove connected edges (like server does)
                    const connEdges = network.getConnectedEdges(action.id);
                    if (connEdges && connEdges.length) edges.remove(connEdges);
                    nodes.remove(action.id);
                    break;
                }
                case 'add_edge': {
                    const { action: _, ...edgeData } = action;
                    if (!edgeData.id) {
                        edgeData.id = edgeData.from + '-' + (edgeData.label || '') + '-' + edgeData.to;
                    }
                    if (!edges.get(edgeData.id)) {
                        edges.add(edgeData);
                    }
                    break;
                }
                case 'remove_edge': {
                    edges.remove(action.id);
                    break;
                }
            }
            // Broadcast to other clients via server relay
            if (broadcast && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({event: 'action', data: action}));
            }
        }

        function executeHookActions(nodeId, eventName) {
            const node = nodes.get(nodeId);
            if (!node) return false;
            const actions = node['on_' + eventName];
            if (!actions || !Array.isArray(actions)) return false;
            for (const act of actions) {
                executeAction(act, true);
            }
            return true;
        }

        // ---------------------------------------------------------------
        // Click/doubleClick dispatcher for hooks
        // ---------------------------------------------------------------
        let lastClickTime = 0;
        let clickTimeout = null;

        network.on('click', function(params) {
            if (params.nodes.length === 0) return;
            const nodeId = params.nodes[0];
            const now = Date.now();
            const delta = now - lastClickTime;
            lastClickTime = now;

            if (delta < 300) {
                // Double-click detected — cancel pending single-click
                if (clickTimeout) { clearTimeout(clickTimeout); clickTimeout = null; }
                executeHookActions(nodeId, 'doubleClick');
            } else {
                // Delay single-click to distinguish from double-click
                clickTimeout = setTimeout(() => {
                    clickTimeout = null;
                    executeHookActions(nodeId, 'click');
                }, 310);
            }
        });

        // ---------------------------------------------------------------
        // Process text into triplets
        // ---------------------------------------------------------------
        function processText(text) {
            const lines = text.split(/[\n\r]+/).map(line => line.trim()).filter(line => line);
            const allWords = lines.join(' ').split(/\s+/).filter(word => word);
            const triplets = [];
            for (let i = 0; i < allWords.length - 2; i += 3) {
                if (i + 2 < allWords.length) {
                    const start = allWords[i].replace(/[;.,!?]$/, '');
                    const edge = allWords[i + 1].replace(/[;.,!?]$/, '');
                    const end = allWords[i + 2].replace(/[;.,!?]$/, '');
                    triplets.push([start, edge, end]);
                }
            }
            return triplets;
        }

        // ---------------------------------------------------------------
        // Input handling — server-first mutations
        // ---------------------------------------------------------------
        function getInputText() {
            return currentInputMode === 'multiline' ? bulkInput.value.trim() : singleInput.value.trim();
        }

        function clearInputText() {
            if (currentInputMode === 'multiline') bulkInput.value = '';
            else singleInput.value = '';
        }

        let serverReadOnly = false;

        function handleSlashCommand(text) {
            if (text === '/clear') {
                if (serverReadOnly) {
                    alert('Server is in read-only mode. /clear is disabled.');
                } else {
                    fetch('/api/clear', {method: 'POST'});
                }
                clearInputText();
                return true;
            }
            if (text === '/help') {
                const roNote = serverReadOnly ? ' (READ-ONLY mode — mutations disabled)\n\n' : '\n';
                alert(
                    'Commands:' + roNote +
                    '  /clear — Clear the entire graph' +
                        (serverReadOnly ? ' (disabled)' : '') + '\n' +
                    '  /help — Show this help\n\n' +
                    'Input:\n' +
                    '  Type three words to add a triplet:\n' +
                    '    Alice knows Bob\n\n' +
                    '  In multiline mode, enter multiple triplets\n' +
                    '  (one per line or space-separated).\n\n' +
                    'Toggle input mode with the button in the top-left corner.'
                );
                clearInputText();
                return true;
            }
            return false;
        }

        async function handleInput() {
            const text = getInputText();
            if (handleSlashCommand(text)) return;

            if (currentInputMode === 'multiline') {
                const triplets = processText(text);
                for (const [start, edge, end] of triplets) {
                    await api.addTriplet(start, edge, end);
                }
                bulkInput.value = '';
            } else {
                const words = text.split(/\s+/);
                if (words.length === 3) {
                    const [start, edge, end] = words.map(w => w.replace(/[;.,!?]$/, ''));
                    await api.addTriplet(start, edge, end);
                    singleInput.value = '';
                } else {
                    alert('Please enter exactly three words: start edge end');
                }
            }
        }

        document.getElementById('add-button').addEventListener('click', handleInput);
        singleInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleInput();
        });

        // ---------------------------------------------------------------
        // graphVis API — exposed to extensions
        // ---------------------------------------------------------------
        window.graphVis = {
            nodes,
            edges,
            network,
            container: document.getElementById('graph'),
            api,
            get ws() { return ws; },
            executeAction,
            executeHookActions,
            sendEvent(eventName, data) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ event: eventName, data: data }));
                }
            },
            onCommand(commandName, handler) {
                extCommandHandlers[commandName] = handler;
            },
        };

        // ---------------------------------------------------------------
        // Extension loader
        // ---------------------------------------------------------------
        async function loadExtensions() {
            try {
                const resp = await fetch('/api/extensions');
                const { extensions } = await resp.json();
                for (const ext of extensions) {
                    if (ext.type === 'css') {
                        const link = document.createElement('link');
                        link.rel = 'stylesheet';
                        link.href = ext.path;
                        document.head.appendChild(link);
                    } else if (ext.type === 'js') {
                        await new Promise((resolve, reject) => {
                            const script = document.createElement('script');
                            script.src = ext.path;
                            script.onload = resolve;
                            script.onerror = () => {
                                console.error('Failed to load extension:', ext.path);
                                resolve(); // Don't block other extensions
                            };
                            document.body.appendChild(script);
                        });
                    }
                }
            } catch (err) {
                console.error('Failed to load extensions:', err);
            }
        }

        // ---------------------------------------------------------------
        // Initial load from server + connect WebSocket + load extensions
        // ---------------------------------------------------------------
        async function init() {
            try {
                const graph = await api.getGraph();
                if (graph.nodes) graph.nodes.forEach(n => { if (!nodes.get(n.id)) nodes.add(n); });
                if (graph.edges) graph.edges.forEach(e => { if (!edges.get(e.id)) edges.add(e); });
            } catch (err) {
                console.error('Failed to load initial graph:', err);
            }
            try {
                const hs = await api.getHighlightMode();
                highlightMgr.updateSettings(hs);
                highlightSelect.value = hs.mode;
            } catch (err) {
                console.error('Failed to load highlight settings:', err);
            }
            try {
                const im = await api.getInputMode();
                setInputMode(im.mode);
            } catch (err) {
                console.error('Failed to load input mode:', err);
            }
            try {
                const ro = await fetch('/api/read-only').then(r => r.json());
                serverReadOnly = ro.read_only;
            } catch (err) {
                console.error('Failed to check read-only status:', err);
            }
            connectWebSocket();
            await loadExtensions();
        }

        init();
    </script>
</body>
</html>
